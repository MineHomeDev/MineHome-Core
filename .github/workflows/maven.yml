name: Build and Release Minecraft Plugin

on:
  push:
    branches:
      - Dev  # Ändere den Branch-Namen, falls nötig
  workflow_dispatch:  # Manuelles Triggern möglich

jobs:
   
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn clean package

      - name: Find JAR file
        id: find_jar
        run: echo "JAR_PATH=$(find target -name '*.jar' | head -n 1)" >> $GITHUB_ENV

      - name: Get version from pom.xml
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
         name: "Release v${{ env.VERSION }}"
         tag_name: "v${{ env.VERSION }}"
         files: target/MineHome-Core-${{ env.VERSION }}.jar
         token: ${{ secrets.GH_TOKEN }}
         prerelease: true
