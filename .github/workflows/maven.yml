name: Build and Release Minecraft Plugin

on:
  push:
    branches:
      - Dev  # Ändere den Branch-Namen, falls nötig
  workflow_dispatch:  # Manuelles Triggern möglich

jobs:
   
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn clean package

      - name: Find JAR file
        id: find_jar
        run: echo "JAR_PATH=$(find target -name '*.jar' | head -n 1)" >> $GITHUB_ENV

      - name: Get Version
        id: version
        run: echo "VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR_PATH }}
          token: ${{ secrets.GH_TOKEN }}
          tag_name: v${{ env.VERSION }}
          release_name: "Dev ${{ env.VERSION }}"
          body: "Automatisch gebautes Release."
          draft: false
          prerelease: false
